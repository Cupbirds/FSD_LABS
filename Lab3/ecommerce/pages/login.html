<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Velora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
    <main class="auth-form-page">
        <div class="auth-card">
            <a href="../index.html" class="text-decoration-none text-dark d-inline-block mb-4">← Back to store</a>
            <p class="section-tag">Welcome back</p>
            <h2>Login</h2>
            <p>Continue with your account and pick up where you left off.</p>

            <form>
                <div class="mb-3">
                    <label class="form-label">Email address</label>
                    <input type="email" class="form-control" placeholder="hello@velora.com" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" />
                </div>
                <button type="button" class="btn btn-primary w-100 rounded-pill mb-3">Login</button>
                <div class="text-center">
                    <span class="text-muted">Need an account?</span>
                    <a href="signup.html" class="ms-1 text-decoration-none fw-bold">Sign up</a>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
