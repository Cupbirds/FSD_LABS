<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 3 - Bootstrap Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --night: #010308;
            --navy: #101c2d;
            --paper: #f4f6f1;
            --muted: rgba(244, 246, 241, 0.7);
            --line: rgba(244, 246, 241, 0.12);
            --coral: #ff705c;
            --mint: #b9e6cf;
            --blue: #8bc8ee;
            --card: rgba(15, 22, 32, 0.82);
            --shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: 'Space Grotesk', 'Trebuchet MS', sans-serif;
            background: var(--night);
            color: var(--paper);
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 112, 92, 0.16), transparent 20%),
                radial-gradient(circle at 80% 12%, rgba(139, 200, 238, 0.16), transparent 22%),
                radial-gradient(circle at 50% 80%, rgba(185, 230, 207, 0.08), transparent 30%),
                linear-gradient(180deg, #010308 0%, #071320 40%, #010308 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(2px 2px at 8% 18%, rgba(255, 255, 255, 0.75), transparent),
                radial-gradient(2px 2px at 24% 44%, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(2px 2px at 42% 28%, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(2px 2px at 61% 12%, rgba(255, 255, 255, 0.9), transparent),
                radial-gradient(2px 2px at 75% 36%, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(2px 2px at 86% 22%, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(2px 2px at 18% 74%, rgba(255, 255, 255, 0.8), transparent),
                radial-gradient(2px 2px at 52% 68%, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(2px 2px at 72% 78%, rgba(255, 255, 255, 0.85), transparent),
                radial-gradient(2px 2px at 94% 56%, rgba(255, 255, 255, 0.75), transparent);
            opacity: 0.8;
            pointer-events: none;
            animation: twinkle 8s ease-in-out infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(90deg, rgba(1, 3, 8, 0.72), rgba(1, 3, 8, 0.25), rgba(1, 3, 8, 0.72));
            pointer-events: none;
        }

        .lab-shell {
            position: relative;
            z-index: 1;
            width: min(820px, calc(100% - 32px));
            padding: 42px 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--paper);
            text-decoration: none;
            font-size: 0.78rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: 700;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: var(--mint);
            color: var(--night);
            font-family: 'DM Mono', monospace;
            transform: rotate(-8deg);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(244, 246, 241, 0.7);
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #42bd79;
            box-shadow: 0 0 0 5px rgba(66, 189, 121, 0.14);
            animation: pulse 2.1s ease-in-out infinite;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            padding: 10px 16px;
            border: 1px solid rgba(139, 200, 238, 0.5);
            border-radius: 999px;
            background: rgba(16, 28, 45, 0.7);
            color: var(--paper);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .back-link:hover {
            transform: translateY(-1px);
            border-color: rgba(185, 230, 207, 0.8);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-decoration: none;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.7rem, 6vw, 4.2rem);
            letter-spacing: -0.07em;
            line-height: 0.9;
            color: var(--paper);
        }

        .task-panel {
            border: 1px solid var(--line) !important;
            border-radius: 20px !important;
            background: rgba(15, 22, 32, 0.82) !important;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .task-panel .list-group-item {
            border-color: rgba(244, 246, 241, 0.1) !important;
            background: rgba(255, 255, 255, 0.02) !important;
            color: var(--paper) !important;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .task-panel .list-group-item:hover,
        .task-panel .list-group-item:focus {
            transform: translateY(-1px);
            border-color: rgba(255, 112, 92, 0.45) !important;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18);
            z-index: 1;
        }

        .task-panel .text-secondary,
        .task-panel small {
            color: rgba(244, 246, 241, 0.7) !important;
        }

        .task-panel strong {
            color: var(--paper);
        }

        .task-panel .list-group-item span:last-child {
            color: var(--coral);
            font-weight: 700;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.5;
                transform: scale(1);
            }

            100% {
                opacity: 0.9;
                transform: scale(1.08);
            }
        }

        @keyframes pulse {
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        @media (max-width: 560px) {
            .lab-shell {
                padding-top: 28px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <main class="lab-shell">
        <header class="topbar" aria-label="Lab header">
            <a class="brand" href="../index.html" aria-label="Back to home">
                <span class="brand-mark">F/</span>
                <span>FSD Labs</span>
            </a>
            <span class="status"><span class="status-dot"></span> Studio online</span>
        </header>

        <a class="back-link" href="../index.html">← Back to Lab 3 options</a>
        <h1>Bootstrap Tasks</h1>
        <p class="text-secondary mb-4">Choose one of the lab tasks below.</p>
        <div class="list-group task-panel shadow-sm">
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3"
                href="task1.html">
                <span><strong>Task 1</strong><small class="d-block text-secondary">Design your class
                        timetable</small></span><span>→</span>
            </a>
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3"
                href="task2.html">
                <span><strong>Task 2</strong><small class="d-block text-secondary">Design a Facebook home
                        page</small></span><span>→</span>
            </a>
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3"
                href="task3.html">
                <span><strong>Task 3</strong><small class="d-block text-secondary">Design a personal
                        portfolio</small></span><span>→</span>
            </a>
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3"
                href="task4.html">
                <span><strong>Task 4</strong><small class="d-block text-secondary">Design a custom
                        UI</small></span><span>→</span>
            </a>
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3"
                href="task5.html">
                <span><strong>Task 5</strong><small class="d-block text-secondary">Design an IEEE paper
                        template</small></span><span>→</span>
            </a>
        </div>
    </main>
</body>

</html>
