<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facebook Home Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f0f2f5}.brand{color:#1877f2}.story{height:180px;background:linear-gradient(135deg,#6c8df5,#b56bd4)}
  </style>
</head>
<body>
  <nav class="navbar bg-white border-bottom sticky-top"><div class="container-fluid">
    <a class="navbar-brand fw-bold fs-3 brand" href="#">facebook</a>
    <form class="d-none d-md-flex" role="search"><input class="form-control rounded-pill" placeholder="Search Facebook"></form>
    <div class="d-flex gap-2"><button class="btn btn-light rounded-circle">⌂</button><button class="btn btn-light rounded-circle">☰</button><span class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:40px;height:40px">AA</span></div>
  </div></nav>
  <main class="container py-3"><div class="row g-3">
    <aside class="col-lg-3 d-none d-lg-block"><div class="list-group list-group-flush bg-transparent"><a class="list-group-item bg-transparent border-0" href="#">👤 Abdullah Abdullah</a><a class="list-group-item bg-transparent border-0" href="#">👥 Friends</a><a class="list-group-item bg-transparent border-0" href="#">🕘 Memories</a><a class="list-group-item bg-transparent border-0" href="#">📌 Saved</a></div></aside>
    <section class="col-lg-6">
      <div class="card border-0 shadow-sm mb-3"><div class="card-body"><div class="d-flex gap-2"><span class="rounded-circle bg-primary text-white p-2">AA</span><input class="form-control rounded-pill" placeholder="What's on your mind?"></div><hr><div class="row text-center"><div class="col text-danger">📹 Live video</div><div class="col text-success">🖼 Photo/video</div><div class="col text-warning">😊 Feeling</div></div></div></div>
      <div class="card border-0 shadow-sm mb-3"><div class="card-body"><h6>Stories</h6><div class="d-flex gap-2 overflow-auto"><div class="story rounded text-white p-2 d-flex align-items-end flex-shrink-0" style="width:105px">Create story</div><div class="story rounded text-white p-2 d-flex align-items-end flex-shrink-0" style="width:105px">Maryam</div><div class="story rounded text-white p-2 d-flex align-items-end flex-shrink-0" style="width:105px">Junaid</div></div></div></div>
      <article class="card border-0 shadow-sm"><div class="card-body"><h6>Abdullah Abdullah <small class="text-secondary">· 2h</small></h6><p>Learning Bootstrap makes responsive layouts much easier!</p><div class="bg-primary-subtle rounded p-5 text-center fs-1">🌐</div><div class="d-flex justify-content-around pt-3 text-secondary"><span>Like</span><span>Comment</span><span>Share</span></div></div></article>
    </section>
    <aside class="col-lg-3 d-none d-lg-block"><div class="card border-0 shadow-sm"><div class="card-body"><h6>Contacts</h6><p>🟢 Maryam Wardah</p><p>🟢 Junaid Nazar</p><p>🟢 Eemaan Fatima</p></div></div></aside>
  </div></main>
</body>
</html>
