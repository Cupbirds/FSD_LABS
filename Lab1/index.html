<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .calculator {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            width: 280px;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 28px;
            text-align: right;
            padding: 0 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: #fff;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #444;
            color: #fff;
        }

        .btn-op {
            background: #ff9500;
        }

        .btn-equals {
            background: #ff9500;
        }

        .btn-clear {
            background: #a5a5a5;
            color: #000;
        }

        .btn-zero {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" readonly value="0">

        <div class="buttons">
            <button class="btn-clear">C</button>
            <button class="btn-op">±</button>
            <button class="btn-op">%</button>
            <button class="btn-op">/</button>

            <button class="btn-num">7</button>
            <button class="btn-num">8</button>
            <button class="btn-num">9</button>
            <button class="btn-op">*</button>

            <button class="btn-num">4</button>
            <button class="btn-num">5</button>
            <button class="btn-num">6</button>
            <button class="btn-op">-</button>

            <button class="btn-num">1</button>
            <button class="btn-num">2</button>
            <button class="btn-num">3</button>
            <button class="btn-op">+</button>

            <button class="btn-num btn-zero">0</button>
            <button class="btn-num">.</button>
            <button class="btn-equals">=</button>
        </div>
    </div>
</body>
</html>
